#
# exceptions-packages publish configuration
#

# This group is the *single, curated* escape hatch from the
# "every binary RPM produced by an SRPM must publish to the same channel"
# policy enforced by `scripts/split-repo-by-channel.py`.
#
# Each package listed here is a sibling sub-package of an SRPM whose other
# binary RPMs belong in `base`, but where this specific sub-package is
# explicitly carved out and published to `sdk` instead. Typical reasons:
#
#   - Windows cross-compile artifacts (mingw32-*, mingw64-*, rust windows-gnu
#     std libs) that are produced by otherwise-base SRPMs but have no place
#     in a supported Linux runtime.
#
# Every entry MUST have a corresponding exception in
# `scripts/srpm-consistency-allowlist.toml` so the consistency check
# remains green. Keep this list minimal and surgical -- prefer demoting
# the whole SRPM whenever the base footprint is small enough to make that
# reasonable.

[package-groups.exceptions-packages]
description = "curated per-SRPM channel-consistency exceptions"
default-package-config.publish.channel = "rpm-sdk"
packages = [
    # Qt5 GUI for editing doxygen configs; pulls full Qt5 stack.
    "doxygen-doxywizard",
    # LaTeX/PDF output backend; pulls full TeXLive (~6500 pkgs).
    "doxygen-latex",

    # Windows (mingw) cross-compile artifacts; not part of the supported Linux runtime.
    "mingw32-check",
    "mingw32-eigen3",
    "mingw32-enchant2",
    "mingw32-freexl",
    "mingw32-geos",
    "mingw32-giflib",
    "mingw32-giflib-tools",
    "mingw32-gnutls",
    "mingw32-hidapi",
    "mingw32-inih",
    "mingw32-json-c",
    "mingw32-leptonica",
    "mingw32-libfdt",
    "mingw32-libfdt-static",
    "mingw32-libgcab1",
    "mingw32-libgeotiff",
    "mingw32-libgeotiff-tools",
    "mingw32-libgsf",
    "mingw32-libkml",
    "mingw32-liblerc",
    "mingw32-libosinfo",
    "mingw32-librttopo",
    "mingw32-libsodium",
    "mingw32-libspatialite",
    "mingw32-libusb1",
    "mingw32-libvirt",
    "mingw32-libvirt-gconfig",
    "mingw32-libvirt-glib",
    "mingw32-libvirt-gobject",
    "mingw32-libwebp",
    "mingw32-libxmlb",
    "mingw32-libyaml",
    "mingw32-nbdkit",
    "mingw32-openjpeg",
    "mingw32-openjpeg-tools",
    "mingw32-opus",
    "mingw32-osinfo-db",
    "mingw32-osinfo-db-tools",
    "mingw32-p11-kit",
    "mingw32-proj",
    "mingw32-python3-libkml",
    "mingw32-shapelib",
    "mingw32-shapelib-static",
    "mingw32-shapelib-tools",
    "mingw32-uriparser",
    "mingw32-xerces-c",
    "mingw64-check",
    "mingw64-eigen3",
    "mingw64-enchant2",
    "mingw64-freexl",
    "mingw64-geos",
    "mingw64-giflib",
    "mingw64-giflib-tools",
    "mingw64-gnutls",
    "mingw64-hidapi",
    "mingw64-inih",
    "mingw64-json-c",
    "mingw64-leptonica",
    "mingw64-libfdt",
    "mingw64-libfdt-static",
    "mingw64-libgcab1",
    "mingw64-libgeotiff",
    "mingw64-libgeotiff-tools",
    "mingw64-libgsf",
    "mingw64-libkml",
    "mingw64-liblerc",
    "mingw64-libosinfo",
    "mingw64-librttopo",
    "mingw64-libsodium",
    "mingw64-libspatialite",
    "mingw64-libusb1",
    "mingw64-libvirt",
    "mingw64-libvirt-gconfig",
    "mingw64-libvirt-glib",
    "mingw64-libvirt-gobject",
    "mingw64-libwebp",
    "mingw64-libxmlb",
    "mingw64-libyaml",
    "mingw64-nbdkit",
    "mingw64-openjpeg",
    "mingw64-openjpeg-tools",
    "mingw64-opus",
