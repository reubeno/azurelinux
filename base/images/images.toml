[images.vm-base]
description = "VM Base Image"
definition = { type = "kiwi", path = "vm-base/vm-base.kiwi" }
tests.test-suites = [
    { name = "static-image-checks" },
    { name = "lisa-qemu" },
]

[images.vm-base.capabilities]
machine-bootable = true
container = false
systemd = true
runtime-package-management = true

[images.container-base]
description = "Container Base Image"
definition = { type = "kiwi", path = "container-base/container-base.kiwi", profile = "core" }
tests.test-suites = [{ name = "static-image-checks" }]

[images.container-base.capabilities]
machine-bootable = false
container = true
systemd = false
runtime-package-management = true

[images.container-distroless-minimal]
description = "Container Distroless Minimal Image"
definition = { type = "kiwi", path = "container-base/container-base.kiwi", profile = "distroless-minimal" }
tests.test-suites = [{ name = "static-image-checks" }]

[images.container-distroless-minimal.capabilities]
machine-bootable = false
container = true
systemd = false
runtime-package-management = false

[images.container-distroless-base]
description = "Container Distroless Base Image"
definition = { type = "kiwi", path = "container-base/container-base.kiwi", profile = "distroless-base" }
tests.test-suites = [{ name = "static-image-checks" }]

[images.container-distroless-base.capabilities]
machine-bootable = false
container = true
systemd = false
runtime-package-management = false

[images.container-distroless-debug]
description = "Container Distroless Debug Image"
definition = { type = "kiwi", path = "container-base/container-base.kiwi", profile = "distroless-debug" }
tests.test-suites = [{ name = "static-image-checks" }]

[images.container-distroless-debug.capabilities]
machine-bootable = false
container = true
systemd = false
runtime-package-management = false

# ---- Test suites ----

# Single test suite shared by all images.  Capability marks and image marks
# on individual tests handle filtering — azldev passes --capabilities and
# --image-name so tests self-select.
[test-suites.static-image-checks]
type = "pytest"
description = "Offline image validation (shared + image-specific tests)"

[test-suites.static-image-checks.pytest]
working-dir = "tests"
test-paths = ["cases/"]
extra-args = [
    "-vv",
    "--image-path", "{image-path}",
    "--image-name", "{image-name}",
    "--capabilities", "{capabilities}"
]

# LISA live VM tests using QEMU.
# Framework pinned to release 20260330.1.
[test-suites.lisa-qemu]
type = "lisa"
description = "LISA live VM tests via QEMU"

[test-suites.lisa-qemu.lisa]
pip-pre-install = ["libvirt-python"]
pip-extras = ["azure"]
extra-args = ["-v", "qcow2:{image-path}", "-v", "admin_private_key_file:{admin-key-path}", "-v", "network_boot_timeout:120"]

[test-suites.lisa-qemu.lisa.framework]
git-url = "https://github.com/microsoft/lisa.git"
ref = "fba8a88f0b346fdcafb4a9884f0f17a86c92303b"

[test-suites.lisa-qemu.lisa.runbook]
git-url = "https://github.com/microsoft/lisa.git"
ref = "fba8a88f0b346fdcafb4a9884f0f17a86c92303b"
path = "lisa/microsoft/runbook/qemu/CBL-Mariner.yml"
