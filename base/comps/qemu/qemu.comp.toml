[components.qemu]

# Disable Xen support — not applicable to Azure Linux's Hyper-V/KVM environment.
# The upstream spec enables Xen when %fedora is set (which it is on our builders),
# so we must explicitly override have_xen back to 0.
[[components.qemu.overlays]]
description = "Disable Xen support - not needed for Azure Linux (Hyper-V/KVM only)"
type = "spec-search-replace"
regex = '%global have_xen 1'
replacement = '%global have_xen 0'

# Disable BrlAPI / Baum Braille terminal char-device backend.
# AZL is a headless cloud distro and does not ship the brltty Braille
# stack in base; with brltty demoted to sdk the qemu-char-baum sub-package
# (a chardev plugin that bridges the host Baum Braille terminal into a
# guest via brlapi) is not useful and unconditionally pulled brlapi (and
# transitively brltty) into the base channel. The upstream spec gates
# both the %package char-baum definition and the per-emulator
# `Requires: %{name}-char-baum` line on `%global have_brlapi`.
[[components.qemu.overlays]]
description = "Disable Baum Braille char-device backend - brltty is sdk-tier in AZL"
type = "spec-search-replace"
regex = '^%global have_brlapi 1$'
replacement = '%global have_brlapi 0'

# Disable JACK audio backend. AZL is a headless cloud distro; JACK (the
# pro-audio routing daemon) and ffado (FireWire pro-audio) are sdk-tier.
# The upstream spec gates both the %package audio-jack definition and
# the per-emulator `Requires: %{name}-audio-jack` line on %global have_jack;
# flipping it to 0 stops producing qemu-audio-jack and removes the
# cascading hard-Require from all qemu-system-* emulators, so
# jack-audio-connection-kit + libffado can be cleanly demoted to sdk.
[[components.qemu.overlays]]
description = "Disable JACK audio backend - jack/ffado are sdk-tier in AZL"
type = "spec-search-replace"
regex = '^%global have_jack 1$'
replacement = '%global have_jack 0'

# Disable PulseAudio audio backend. AZL is a headless cloud distro;
# pulseaudio is being demoted to sdk in its entirety, so qemu-audio-pa
# (links libpulse) cannot stay in base. The upstream spec lacks a
# have_pa macro - audio-pa is built unconditionally and its Requires
# line cascades into every qemu-system-* emulator. Surgically remove
# the audio-pa sub-package, unhook the Requires cascade, and switch
# configure to --disable-pa.

# 1. Unhook the cascading audio-pa Requires from every qemu-system-*
#    emulator by emptying the requires_audio_pa macro.
[[components.qemu.overlays]]
description = "Empty requires_audio_pa macro - unhook qemu-audio-pa Requires from emulators"
type = "spec-search-replace"
regex = '^%define requires_audio_pa Requires: %\{name\}-audio-pa = %\{evr\}$'
replacement = '%define requires_audio_pa %{nil}'

# 2. Drop literal "pa," from --audio-drv-list (no longer building PA driver).
[[components.qemu.overlays]]
description = "Drop pa from --audio-drv-list (PulseAudio backend disabled)"
type = "spec-search-replace"
regex = '--audio-drv-list=pipewire,pa,sdl,alsa,'
replacement = '--audio-drv-list=pipewire,sdl,alsa,'

# 3. Switch configure flag from --enable-pa to --disable-pa.
[[components.qemu.overlays]]
description = "configure: --enable-pa -> --disable-pa"
type = "spec-search-replace"
regex = '^  --enable-pa \\$'
replacement = '  --disable-pa \'

# 4. Remove the audio-pa sub-package definition.
[[components.qemu.overlays]]
description = "Remove %package audio-pa - sub-package no longer built"
type = "spec-remove-section"
section = "%package"
package = "audio-pa"

[[components.qemu.overlays]]
description = "Remove %description audio-pa - sub-package no longer built"
type = "spec-remove-section"
section = "%description"
package = "audio-pa"

[[components.qemu.overlays]]
description = "Remove %files audio-pa - sub-package no longer built"
type = "spec-remove-section"
section = "%files"
package = "audio-pa"

# Disable PipeWire audio backend. AZL is a headless cloud distro;
# pipewire is sdk-tier, so qemu-audio-pipewire (links libpipewire-0.3)
# cannot stay in base. Same surgical pattern as PA: empty the
# requires_audio_pipewire macro, drop 'pipewire' from --audio-drv-list,
# switch configure to --disable-pipewire, and remove the sub-package.

[[components.qemu.overlays]]
description = "Empty requires_audio_pipewire macro - unhook qemu-audio-pipewire Requires from emulators"
type = "spec-search-replace"
regex = '^%define requires_audio_pipewire Requires: %\{name\}-audio-pipewire = %\{evr\}$'
replacement = '%define requires_audio_pipewire %{nil}'

[[components.qemu.overlays]]
description = "Drop pipewire from --audio-drv-list (PipeWire backend disabled)"
type = "spec-search-replace"
regex = '--audio-drv-list=pipewire,sdl,alsa,'
replacement = '--audio-drv-list=sdl,alsa,'

[[components.qemu.overlays]]
description = "configure: --enable-pipewire -> --disable-pipewire"
type = "spec-search-replace"
regex = '^  --enable-pipewire \\$'
replacement = '  --disable-pipewire \'

[[components.qemu.overlays]]
description = "Remove %package audio-pipewire - sub-package no longer built"
type = "spec-remove-section"
section = "%package"
package = "audio-pipewire"

[[components.qemu.overlays]]
description = "Remove %description audio-pipewire - sub-package no longer built"
type = "spec-remove-section"
section = "%description"
package = "audio-pipewire"

[[components.qemu.overlays]]
description = "Remove %files audio-pipewire - sub-package no longer built"
type = "spec-remove-section"
section = "%files"
package = "audio-pipewire"
