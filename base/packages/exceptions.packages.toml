    "mingw32-proj",
    "mingw32-python3-libkml",
    "mingw32-shapelib",
    "mingw32-shapelib-static",
    "mingw32-shapelib-tools",
    "mingw32-uriparser",
    "mingw32-xerces-c",
    "mingw64-check",
    "mingw64-eigen3",
    "mingw64-enchant2",
    "mingw64-freexl",
    "mingw64-geos",
    "mingw64-giflib",
    "mingw64-giflib-tools",
