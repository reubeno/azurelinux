#
# Published and build-system RPM repositories used for repeatable comparisons.
#

[resources.rpm-repo-sets.azl4-koji]
description = "Current Azure Linux 4 Koji build tag"
template = "koji-dist-repo"
base-uri = "https://52.185.225.133/kojifiles/repos/azl4-build/latest"
name-prefix = "azl4-koji-"
disable-gpg-check = true
disable-ssl-verify = true
unrouted = true
subrepos = ["binary"]

[resources.rpm-repo-sets.azl4-pmc-preview]
description = "Azure Linux 4 PMC preview"
template = "azl-standard"
base-uri = "https://packages.microsoft.com/azurelinux/4/preview"
name-prefix = "azl4-preview-"
disable-gpg-check = true

[resources.rpm-repo-sets.azl4-pmc-prod]
description = "Azure Linux 4 PMC production"
template = "azl-standard"
base-uri = "https://packages.microsoft.com/azurelinux/4/prod"
name-prefix = "azl4-prod-"
disable-gpg-check = true

[resources.rpm-repo-comparisons.azl4-koji-vs-preview]
left = "azl4-koji"
right = "azl4-pmc-preview"
arches = ["x86_64", "aarch64"]
check-publish-routing = true
skip-checksum-comparison = true
ignore-older-added-in-right = true

[resources.rpm-repo-comparisons.azl4-koji-vs-preview-latest]
left = "azl4-koji"
right = "azl4-pmc-preview"
arches = ["x86_64", "aarch64"]
latest-only = true
check-publish-routing = true
skip-checksum-comparison = true
ignore-older-added-in-right = true

[resources.rpm-repo-comparisons.azl4-preview-vs-prod]
left = "azl4-pmc-preview"
right = "azl4-pmc-prod"
arches = ["x86_64", "aarch64"]
check-publish-routing = true

[resources.rpm-repo-comparisons.azl4-preview-vs-prod-latest]
left = "azl4-pmc-preview"
right = "azl4-pmc-prod"
arches = ["x86_64", "aarch64"]
latest-only = true
check-publish-routing = true
