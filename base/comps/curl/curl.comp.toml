[components.curl]

[[components.curl.overlays]]
description = "Drop python3-impacket BuildRequires (only used by Fedora-gated upstream test 1451; python-impacket is not packaged for Azure Linux due to RPM-signing issues)"
type = "spec-remove-tag"
tag = "BuildRequires"
value = "python3-impacket"

# Update the now-stale comment in the (empty) `%if 0%{?fedora}` block left
# behind by removing the BuildRequires above, so future readers know the
# omission is intentional rather than an oversight.
[[components.curl.overlays]]
description = "Annotate the now-empty %if 0%{?fedora} block to make the AZL deviation explicit (avoid confusion with the original 'needed for upstream test 1451' comment)"
type = "spec-search-replace"
regex = '^# needed for upstream test 1451$'
replacement = '# python3-impacket BuildRequires intentionally omitted in Azure Linux — see curl.comp.toml overlay (RPM signing blocker; test 1451 is Fedora-gated)'

# Disable openldap support in curl: drop the openldap-devel BuildRequires and
# flip --enable-ldap/--enable-ldaps to --disable-ldap/--disable-ldaps in the
# "full" configure invocation. The "minimal" build already passes
# --disable-ldap/--disable-ldaps upstream, so no change is needed there.
[[components.curl.overlays]]
description = "Drop openldap-devel BuildRequires — Azure Linux curl does not link against openldap (LDAP/LDAPS protocols disabled)"
type = "spec-remove-tag"
tag = "BuildRequires"
value = "openldap-devel"

[[components.curl.overlays]]
description = "Disable LDAP protocol support in the curl 'full' build (drop dependency on openldap)"
type = "spec-search-replace"
section = "%build"
regex = '--enable-ldap\b'
replacement = '--disable-ldap'

[[components.curl.overlays]]
description = "Disable LDAPS protocol support in the curl 'full' build (drop dependency on openldap)"
type = "spec-search-replace"
section = "%build"
regex = '--enable-ldaps\b'
replacement = '--disable-ldaps'

# Trim the `libcurl-minimal` subpackage further: Fedora's upstream spec
# puts `--with-gssapi` and `--with-libidn2` in the shared
# `common_configure_opts`, so they apply to both the full and minimal
# builds. For the minimal build that's overkill — it ships to images
# (like container-base) that fetch from ASCII repo hostnames over
# anonymous HTTPS and have no business pulling in `krb5-libs`,
# `keyutils-libs`, `libcom_err`, `libverto`, or `libidn2`. Append
# `--without-gssapi --without-libidn2` to the minimal block only.
# The full libcurl is untouched, so users that need GSSAPI/IDN can
# still swap `libcurl-minimal` for `libcurl`.
#
# `--without-libssh` is the last line of the minimal configure block
# upstream and is unique to that block (full uses `--with-libssh`),
# so it's a safe anchor for the replacement.
[[components.curl.overlays]]
description = "Drop GSSAPI/Kerberos and libidn2 support from libcurl-minimal (full libcurl keeps them)"
type = "spec-search-replace"
section = "%build"
regex = '--without-libssh\b'
replacement = '--without-libssh --without-gssapi --without-libidn2'
