#
# base-sibling-packages publish configuration
#

# This group contains sub-packages that are "siblings" to packages
# in `base`. In other words, none of these packages were intentionally
# selected for inclusion in `base`, but they were produced by building
# source components that also produced packages that *were* intentionally
# selected for inclusion in `base`.
#
# Per project policy, every binary RPM produced by a given SRPM must publish
# to the same channel. Sub-packages whose SRPM contributes to `base` are
# therefore moved into `base-packages` directly. The packages that remain
# here are siblings of `base` packages whose SRPMs are NOT present in
# `base-packages`, and which we choose to ship via `sdk` rather than pull
# the rest of their SRPM into `base`.
[package-groups.base-sibling-packages]
description = "base sibling packages"
default-package-config.publish.channel = "rpm-sdk"
