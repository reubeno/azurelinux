[images.vm-base]
description = "VM Base Image"
definition = { type = "kiwi", path = "vm-base/vm-base.kiwi" }
tests.test-suites = [
    { name = "common-vm-checks" },
    { name = "vm-base-checks" },
]

[images.container-base]
description = "Container Base Image"
definition = { type = "kiwi", path = "container-base/container-base.kiwi", profile = "core" }
tests.test-suites = [
    { name = "common-container-checks" },
    { name = "container-base-checks" },
]

[images.container-distroless-minimal]
description = "Container Distroless Minimal Image"
definition = { type = "kiwi", path = "container-base/container-base.kiwi", profile = "distroless-minimal" }

[images.container-distroless-base]
description = "Container Distroless Base Image"
definition = { type = "kiwi", path = "container-base/container-base.kiwi", profile = "distroless-base" }
tests.test-suites = [
    { name = "common-container-checks" },
    { name = "container-base-checks" },
]

[images.container-distroless-debug]
description = "Container Distroless Debug Image"
definition = { type = "kiwi", path = "container-base/container-base.kiwi", profile = "distroless-debug" }

# ---- Test suites ----

# Shared checks applicable to all VM images (OS release, packages, repos, services, filesystem).
[test-suites.common-vm-checks]
type = "pytest"
description = "Common offline validation checks for VM images"

[test-suites.common-vm-checks.pytest]
working-dir = "tests"
test-paths = ["cases/test_*.py"]
extra-args = ["--image-path", "{image-path}"]

# VM-base specific checks (partitions, bootloader, kernel).
[test-suites.vm-base-checks]
type = "pytest"
description = "VM base image specific checks"

[test-suites.vm-base-checks.pytest]
working-dir = "tests"
test-paths = ["cases/vm-base/"]
extra-args = ["--image-path", "{image-path}"]

# Shared checks applicable to all container images.
[test-suites.common-container-checks]
type = "pytest"
description = "Common offline validation checks for container images"

[test-suites.common-container-checks.pytest]
working-dir = "tests"
test-paths = ["cases/test_*.py"]
extra-args = ["--image-path", "{image-path}"]

# Container-base specific checks.
[test-suites.container-base-checks]
type = "pytest"
description = "Container base image specific checks"

[test-suites.container-base-checks.pytest]
working-dir = "tests"
test-paths = ["cases/container-base/"]
extra-args = ["--image-path", "{image-path}"]

# NOTE:
