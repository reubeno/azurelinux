# Allowlist of intentionally-unresolved dependencies for repoclosure.
#
# Each [[ignore]] entry suppresses a single (consumer package, missing
# requirement) pair from the filtered repoclosure report. The "raw" report
# is always preserved unfiltered, and a "hits" report records which entries
# matched (so we can spot stale entries).
#
# Fields:
#   package             Consumer package name (or list of names). Glob
#                       patterns supported (fnmatch). When a list is given,
#                       the entry matches any consumer matching any pattern
#                       in the list. This is the package whose unresolved
#                       dependency we accept.
#   requires            The exact unresolved requirement string as printed by
#                       `dnf repoclosure` (e.g. "libfoo.so.1()(64bit)" or
#                       "perl(Some::Module)"), or a list of such strings.
#                       Glob patterns supported. When a list is given, the
#                       entry matches any requires matching any pattern in
#                       the list. The combination of package-list and
#                       requires-list lets one entry suppress an entire
#                       Cartesian product of (consumer, dep) pairs in one
#                       shot — essential for "overlay-pending" suppressions
#                       where a single overlay (e.g. flipping a
#                       %global __with_<feature> toggle) eliminates many
#                       feature-conditional Requires lines across many
#                       sub-packages at once.
#   scope               Which repoclosure run this applies to:
#                         "base"     - base-only run
#                         "base+sdk" - base + sdk run
#                         "any"      - both (default)
#   reason              Free-form rationale.
#   confidence          "high" | "medium" | "low" - our confidence that
#                       dropping this dependency is safe.
#
# Optional provenance for "overlay-pending" suppressions (the case where
# we have already authored a comp.toml overlay that drops the offending
# Requires from the rebuilt RPM, but the prebuilt RPM corpus our pipeline
# checks against was published *before* the overlay landed, so the dep
# still appears in the raw findings until the next published-RPM snapshot):
#   overlay             Path to the comp.toml that holds the overlay.
#                       Reviewers can read it to understand the pending fix.
#   verified_at_commit  Git short-sha at which we last locally rebuilt the
#                       affected RPM with `azldev component build` and
#                       confirmed via `rpm -qpR` that the dep is gone.
#                       Bump this whenever the overlay or upstream changes.
#                       Once the next published-RPM snapshot includes the
#                       overlay, the raw finding disappears, this entry
#                       stops hitting (visible in repoclosure-base.allowlist-hits.txt
#                       — the entry will simply not appear), and the entry
#                       can be deleted.

# Example (commented out):
# [[ignore]]
# package    = "examplepkg"
# requires   = "libexample.so.1()(64bit)"
# scope      = "base"
# reason     = "Pulled in only by an optional plugin we do not ship."
# confidence = "high"
#
# Example overlay-pending suppression:
# [[ignore]]
# package            = "frobnicator"
# requires           = "libobsolete.so.1()(64bit)"
# scope              = "base"
# reason             = "Overlay drops this Requires; verified rebuilt RPM no longer carries it."
# confidence         = "high"
# overlay            = "base/comps/frobnicator/frobnicator.comp.toml"
# verified_at_commit = "abc1234"

# ----------------------------------------------------------------------
# erlang: erlang-wx GUI sub-package elimination
#
# Two overlays in base/comps/erlang/erlang.comp.toml flip
# `%global __with_wxwidgets` from 1 to 0 and strip the unconditional
# `Requires: %{name}-wx` line from the erlang-src %package preamble.
# That toggle wraps not only the wx-related Requires but also the
# `%package debugger|dialyzer|et|observer|reltool` definitions and
# every `Requires: %{name}-{debugger,dialyzer,et,observer,reltool}`
# line that appears across the in-base erlang sub-package preambles
# (erlang meta, common_test, megaco, src). When the rebuilt RPMs land
# in the next published-RPM snapshot, all of those Requires disappear
# and those five sub-packages cease to be produced.
#
# In the interim our pipeline runs against a pre-overlay snapshot,
# which still carries every wx-conditional Requires. The five
# sub-packages have already been removed from base/packages/base.packages.toml
# (their successor RPMs will not exist), so each consumer that
# Requires them shows up as a leftover finding that is purely an
# artifact of the snapshot lag. The single entry below absorbs the
# entire Cartesian product (4 consumers x 6 deps); not every
# combination corresponds to an actual finding, but suppressing
# non-existent findings is a no-op.
#
# Once the next snapshot incorporates the overlays, this entry will
# go to zero hits in repoclosure-base.allowlist-hits.txt and can be
# deleted in one go.
[[ignore]]
package            = ["erlang", "erlang-common_test", "erlang-megaco", "erlang-src", "erlang-rebar3"]
requires           = [
    "erlang-wx",
    "erlang-wx(*",
    "erlang-debugger",
    "erlang-debugger(*",
    "erlang-dialyzer",
    "erlang-dialyzer(*",
    "erlang-et",
    "erlang-et(*",
    "erlang-observer",
    "erlang-observer(*",
    "erlang-reltool",
    "erlang-reltool(*",
]
scope              = "any"
reason             = "All such Requires are wx-conditional in the upstream spec; the overlay flips %global __with_wxwidgets to 0 (plus strips the one unconditional Requires in erlang-src), so the rebuilt erlang RPMs no longer Require any of these and the wx-conditional sub-packages are no longer produced. Applies to base AND base+sdk closure since the five wx-conditional sub-packages are removed from BOTH channels."
confidence         = "high"
overlay            = "base/comps/erlang/erlang.comp.toml"
verified_at_commit = "84390c4d7d"

# ----------------------------------------------------------------------
# openscap: drop the optional apt-libs Requires
#
# openscap's spec wraps `Requires: apt-libs` (and its apt-devel
# BuildRequires) in `%if %{with apt}`; upstream is `%bcond_without apt`,
# so AZL inherits the dep until we explicitly disable it. The dedicated
# component override at base/comps/openscap/openscap.comp.toml sets
# `build.without = ["apt"]`, which drops the apt-libs Requires from the
# rebuilt openscap RPM (verified locally with `azldev component build
# -p openscap` + `rpm -qpR`). Suppress the leftover finding against the
# pre-overlay published snapshot until the next snapshot picks up the
# new build; at that point this entry will go to zero hits and can be
# deleted.
[[ignore]]
package            = "openscap"
requires           = "apt-libs"
scope              = "base"
reason             = "build.without = [\"apt\"] in base/comps/openscap/openscap.comp.toml drops the optional apt integration at upstream-supported %bcond level; rebuilt openscap RPM no longer Requires apt-libs."
confidence         = "high"
overlay            = "base/comps/openscap/openscap.comp.toml"
verified_at_commit = "0f614bd9c0"

# ----------------------------------------------------------------------
# qemu: drop have_brlapi / qemu-char-baum cascade (brltty demote enabler)
#
# brltty (15 sub-packages) is desktop accessibility tooling and was
# demoted to sdk. The blocker was qemu-char-baum — qemu's BrlAPI
# chardev backend that bridges a host Baum Braille terminal into a
# guest — which is hard-Required by all 19 qemu-system-* emulators
# with versioned exact-version Requires. The overlay in
# base/comps/qemu/qemu.comp.toml flips `%global have_brlapi 1` to 0,
# which both stops producing the qemu-char-baum sub-package and
# drops the per-emulator `Requires: %{name}-char-baum` line entirely.
# Verified locally with `azldev component build -p qemu --no-check`
# + `rpm -qpR`: no qemu RPM Requires anything brl/baum-related, and
# qemu-char-baum is not built.
#
# (--no-check used due to a flaky qtest aspeed_smc-test timeout in
# the build environment unrelated to the overlay; skipping %check is
# safe for a Requires-only validation.)
[[ignore]]
package            = ["qemu-system-aarch64", "qemu-system-alpha", "qemu-system-arm", "qemu-system-avr", "qemu-system-hppa", "qemu-system-loongarch64", "qemu-system-m68k", "qemu-system-microblaze", "qemu-system-mips", "qemu-system-or1k", "qemu-system-ppc", "qemu-system-riscv", "qemu-system-rx", "qemu-system-s390x", "qemu-system-sh4", "qemu-system-sparc", "qemu-system-tricore", "qemu-system-x86", "qemu-system-xtensa"]
requires           = ["qemu-char-baum", "qemu-char-baum(*", "qemu-char-baum = *"]
scope              = "any"
reason             = "qemu overlay flips %global have_brlapi to 0; qemu-char-baum sub-pkg is no longer produced and the per-emulator Requires line is no longer emitted in the rebuilt RPMs."
confidence         = "high"
overlay            = "base/comps/qemu/qemu.comp.toml"
verified_at_commit = "61673f0d25"

# ----------------------------------------------------------------------
# qemu: drop have_jack / qemu-audio-jack cascade (jack/ffado demote enabler)
#
# jack-audio-connection-kit (the JACK pro-audio routing daemon, 3
# sub-pkgs) and libffado (FireWire pro-audio, 3 sub-pkgs) were demoted
# to sdk. The blocker was qemu-audio-jack — qemu's JACK audio backend —
# which is hard-Required (versioned exact-version) by all 19
# qemu-system-* emulators. The overlay in
# base/comps/qemu/qemu.comp.toml flips `%global have_jack 1` to 0,
# which both stops producing the qemu-audio-jack sub-package and
# drops the per-emulator `Requires: %{name}-audio-jack` line entirely.
# Verified locally with `azldev component build -p qemu --no-check`
# + `rpm -qpR`: no qemu RPM Requires anything jack-related, and
# qemu-audio-jack is not built.
[[ignore]]
package            = ["qemu-system-aarch64", "qemu-system-alpha", "qemu-system-arm", "qemu-system-avr", "qemu-system-hppa", "qemu-system-loongarch64", "qemu-system-m68k", "qemu-system-microblaze", "qemu-system-mips", "qemu-system-or1k", "qemu-system-ppc", "qemu-system-riscv", "qemu-system-rx", "qemu-system-s390x", "qemu-system-sh4", "qemu-system-sparc", "qemu-system-tricore", "qemu-system-x86", "qemu-system-xtensa"]
requires           = ["qemu-audio-jack", "qemu-audio-jack(*", "qemu-audio-jack = *"]
scope              = "any"
reason             = "qemu overlay flips %global have_jack to 0; qemu-audio-jack sub-pkg is no longer produced and the per-emulator Requires line is no longer emitted in the rebuilt RPMs."
confidence         = "high"
overlay            = "base/comps/qemu/qemu.comp.toml"
verified_at_commit = "d85ef67af9"

# Snapshot-lag: qemu-audio-jack itself still exists in the published
# snapshot and Requires libjack.so.0; once the snapshot rebuilds qemu
# this sub-pkg disappears entirely (covered by the cascade entry above).
[[ignore]]
package            = "qemu-audio-jack"
requires           = "libjack.so.0()(64bit)"
scope              = "any"
reason             = "qemu-audio-jack will not be built once snapshot picks up the have_jack=0 overlay; libjack moved to sdk."
confidence         = "high"
overlay            = "base/comps/qemu/qemu.comp.toml"
verified_at_commit = "d85ef67af9"

# ----------------------------------------------------------------------
# po4a: drop texlive-kpathsea Requires
#
# po4a is a multi-format documentation translation tool. Its only use
# of texlive-kpathsea is via Locale::Po4a::TeX (which shells out to
# kpsewhich to resolve TeX include paths). All other format modules
# (man, sgml, xml, asciidoc, markdown, docbook, dia, halibut, ...)
# work without it. The overlay in base/comps/po4a/po4a.comp.toml
# drops both runtime Requires lines so po4a can stay in base while
# texlive-kpathsea(-bin) live in sdk.
[[ignore]]
package            = "po4a"
requires           = ["texlive-kpathsea", "texlive-kpathsea-bin"]
scope              = "any"
reason             = "po4a overlay drops the runtime Requires on texlive-kpathsea(-bin); rebuilt RPM verified to have no texlive Requires."
confidence         = "high"
overlay            = "base/comps/po4a/po4a.comp.toml"
verified_at_commit = "ecc3137503"
