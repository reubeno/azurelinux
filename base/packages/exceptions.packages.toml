    # Rust standard library precompiled for Windows-GNU targets; not for Linux runtime.
    "rust-std-static-i686-pc-windows-gnu",
    "rust-std-static-x86_64-pc-windows-gnu",

    # Qt/GTK/Mono GUI bindings; pull qt5-qtbase, qt, qt3, gtk2, mono, gtk-sharp2 from sdk.
    "avahi-qt3",
    "avahi-qt3-devel",
    "avahi-qt4",
    "avahi-qt4-devel",
    "avahi-qt5",
    "avahi-qt5-devel",
    "avahi-sharp",
    "avahi-ui",
    "avahi-ui-devel",
    "avahi-ui-gtk3",
    "avahi-ui-sharp",
    "avahi-ui-sharp-devel",
    "avahi-ui-tools",

    # Qt6 GUI app for wireshark; wireshark-cli (tshark/dumpcap) and wireshark-devel stay in base.
    "wireshark",
    # LaTeX/PDF output backend; pulls full TeXLive (~6500 pkgs).
    "python3-sphinx-latex",
    # Qt5 binding for poppler; pulls full Qt5 stack.
    "poppler-qt5",
    "poppler-qt5-devel",
    # wxWidgets-based 'Observer' GUI; pulls full wxGTK stack.
    "erlang-wx",
    # KDE/Plasma wallet integration; pulls kf5-kcoreaddons, kf5-ki18n, kf5-kwallet.
    "subversion-kde",
    # Fedora installer GUI / live-ISO / install-image / widget-glade-devel sub-packages; pull GUI desktop stack (nm-connection-editor, gnome-kiosk, blivet-gui, glade, zenity, anaconda-webui).
    "anaconda",
    "anaconda-gui",
    "anaconda-install-img-deps",
    "anaconda-live",
    "anaconda-widgets-devel",
    # Qt5 binding pulls qt5-qtbase (sdk); core thrift + glib binding stay in base.
    "thrift-qt",
    # vala-doc requires devhelp (sdk-only, GUI doc browser); CLI vala compiler stays in base.
    "vala-doc",
    # ----------------------------------------------------------------
    # Perl *-tests sub-pkgs (23 entries) — carved from base.
    #
    # These sub-packages ship the parent perl module's upstream test
    # corpus (t/*.t scripts, fixtures, sample data). They are not
    # required at runtime by anything other than someone re-running
    # the module's own self-test suite, which is not a base-supported
    # workflow. Their Requires pull in heavyweight test-harness perl
    # modules (Test::Class, Test::Needs, Test::LeakTrace,
    # Future::AsyncAwait, mod_perl, ...).
    #
    # Carving these 23 sub-pkgs to sdk avoids pulling ~59 sdk SRPMs
    # into base purely to satisfy these test-only deps, while clearing
    # 34 of 47 outstanding perl-cluster repoclosure findings in base.
    # ----------------------------------------------------------------
    "perl-Carp-Clan-tests",
    "perl-DBI-tests",
    "perl-Date-Manip-tests",
    "perl-DateTime-Locale-tests",
    "perl-DateTime-TimeZone-tests",
    "perl-Devel-CheckLib-tests",
    "perl-FCGI-tests",
    "perl-HTTP-Daemon-tests",
    "perl-HTTP-Message-tests",
    "perl-LDAP-tests",
    "perl-LWP-Protocol-https-tests",
    "perl-List-SomeUtils-tests",
    "perl-Log-Log4perl-tests",
    "perl-Module-Build-tests",
    "perl-Module-Install-tests",
    "perl-Module-ScanDeps-tests",
    "perl-Syntax-Keyword-Try-tests",
    "perl-Test-Simple-tests",
    "perl-URI-tests",
    "perl-XML-LibXML-tests",
    "perl-XML-XPath-tests",
    "perl-bignum-tests",
    "perl-libwww-perl-tests",
    # Qt5 binding for gpgme + its devel; gpgme C library and CLI tools stay in base.
    "qgpgme-qt5",
    "qgpgme-qt5-devel",
    # Qt6 PIN-entry GUI for GnuPG; pinentry-curses/-tty stay in base.
    "pinentry-qt",
    # GTK2 GUI for usermode; CLI usermode/userhelper stay in base.
    "usermode-gtk",
    # GTK2 PostGIS shapefile loader GUI; PostGIS server/CLI tools stay in base.
    "postgis-gui",
    # Qt6 SELinux policy analysis GUI + setools meta-pkg (Requires gui); setools-console* CLI tools stay in base.
    "setools-gui",
    "setools",
    # Qt5 PulseAudio equalizer GUI; pulseaudio daemon/utils stay in base.
    "pulseaudio-qpaeq",
    # PyQt6 firewall tray applet; firewalld daemon/CLI tools stay in base.
    "firewall-applet",
    # GTK source-view demo program; librest library stays in base.
    "rest-demo",
    # Optional PyQt4/PyQt5 event-loop integration sub-pkgs; pyudev core stays in base.
    "python3-pyudev-qt4",
    "python3-pyudev-qt5",
    # Testsuite sub-pkg hard-requires setools meta (carved); testsuites belong in sdk.
    "pcp-testsuite",
    # X11 GUI vim — pulls libcanberra (sdk-only)/Xorg/GTK stack; CLI/enhanced/minimal vim stay in base.
    "vim-X11",
    # GTK desktop VM management GUI; virt-install (CLI) and virt-manager-common (shared bits) stay in base.
    "virt-manager",
    # ghostscript dvipdf wrapper script; hard-requires /usr/bin/dvips from texlive (sdk). Core ghostscript + libgs + other tool sub-pkgs stay in base.
    "ghostscript-tools-dvipdf",
    # Legacy CVS contrib scripts requiring perl(getopts.pl), removed from modern Perl. CVS itself is unmaintained legacy; contrib has no place in a base distro.
    "cvs-contrib",
    # LaTeX/dblatex backend for asciidoc; pulls dblatex + texlive-dvipng-bin (sdk). Core asciidoc + asciidoc-doc stay in base.
    "asciidoc-latex",
    # Perl helpers for SYSLINUX bootloader; require unpackaged perl(Crypt::PasswdMD5). SYSLINUX is irrelevant for Azure cloud workloads but kept in base for legacy boot use.
    "syslinux-perl",
    # GUI emacs builds (GTK+X11 and pure-GTK Wayland flavors); pull libpixbufloader-xpm + GTK/X11 stack from sdk. emacs-nox (CLI) and emacs-lucid stay in base.
    "emacs-gtk+x11",
    "emacs-pgtk",
    # texinfo-tex: TeX backend (needs full texlive toolchain incl. /usr/bin/texconfig-sys, epsf.tex); base ships only the texinfo command-line tool
    "texinfo-tex",
    # mythes-eo: Esperanto thesaurus (LibreOffice MyThes); locale-specific, not core base content
    "mythes-eo",
    # mythes-lb: Luxembourgish thesaurus (LibreOffice MyThes); needs mythes core (sdk-only); locale-specific
    "mythes-lb",
    # mythes-lv: Latvian thesaurus (LibreOffice MyThes); needs mythes core (sdk-only); locale-specific
    "mythes-lv",
    # mythes-nb/-nn: Norwegian Bokmal/Nynorsk thesauri (LibreOffice MyThes); need mythes core (sdk-only); locale-specific
    "mythes-nb",
    "mythes-nn",
    # cockpit-389-ds: Cockpit web UI plugin for 389 Directory Server; needs cockpit/cockpit-bridge (sdk-only). 389-ds-base server stays in base; only the web management UI moves to sdk.
    "cockpit-389-ds",
    # cockpit-ha-cluster: Cockpit web UI plugin for pcs/pacemaker HA cluster mgmt; needs cockpit-bridge (sdk-only). pcs CLI stays in base; only the web management UI moves to sdk.
    "cockpit-ha-cluster",
    # maven-doxia-module-markdown: pulls in flexmark-java (54 sub-pkgs) for Markdown rendering; the rest of maven-doxia (core, sink-api, modules apt/xdoc/xhtml5/fml) is foundational Maven plumbing needed in base by maven-doxia-sitetools / maven-reporting-impl / javacc-maven-plugin. Markdown rendering is SDK-tier.
    "maven-doxia-module-markdown",
    # graphviz-sharp: C#/Mono bindings for graphviz; needs mono-core (sdk-only). Mono runtime not appropriate for headless base; graphviz core + native bindings stay in base.
    "graphviz-sharp",
    # Guile bindings for graphviz; pulls libgc + libguile-3.0 (gc + guile30 SRPMs in sdk only). Niche scripting bindings; core graphviz tooling stays in base.
    "graphviz-guile",
    # PDF variant of docbook-utils; pulls texlive-jadetex + texlive-collection-fontsrecommended + texlive-collection-htmlxml + tex(dvips), all sdk-only. Heavy LaTeX toolchain not needed in headless cloud base. The HTML and base docbook-utils sub-pkgs remain in base.
    "docbook-utils-pdf",
    # SELinux GUI sandbox; uses xorg-x11-server-Xephyr (nested X server) to confine X11 apps. xorg-x11-server SRPM is in sdk; the rest of policycoreutils (core SELinux tooling, dbus, devel, gui, newrole, python-utils, restorecond) remains in base.
    "policycoreutils-sandbox",
    # Tk-based SNMP monitoring GUI (tkmib); requires perl-Tk which is now in sdk. The rest of net-snmp (libs, agent, devel, perl, python3, utils) remains in base for headless SNMP.
    "net-snmp-gui",
    # crun-krun (libkrun microvm runtime) and crun-wasm (wasm-library / wasmedge runtime) are exotic OCI-runtime variants for microvm and WebAssembly workloads. The core crun OCI runtime stays in base; only these specialty backends move to sdk.
    "crun-krun",
    "crun-wasm",
    # DevIL ILUT bindings link against Allegro 4 (sdk-only); keep core DevIL libs in base.
    "DevIL-ILUT",
    "DevIL-ILUT-devel",
    # zypper package manager not in AZL base; carve kiwi zypper systemdeps to sdk.
    "kiwi-systemdeps-pkgmgr-zypper",
    # nfs-ganesha (user-space NFS bridge for Ceph/Gluster) lives in sdk; glusterfs-ganesha is the gluster-side bridge and rides with ganesha.
    "glusterfs-ganesha",
    # Sphinx Search Server v2.2.11 (legacy C++ SQL FTS engine, upstream largely abandoned) lives in sdk; mariadb-sphinx-engine is the niche bridge plugin.
    "mariadb-sphinx-engine",
    # fence-agents-compute is the OpenStack-Nova fence agent (sdk-only stack); fence-agents-all rides along since it Requires every individual fence agent.
    "fence-agents-all",
    "fence-agents-compute",
    # fence-agents-aws and -aws-vpc-net are AWS-specific Pacemaker fence agents; carve to sdk (Azure-focused distro).
    "fence-agents-aws",
    "fence-agents-aws-vpc-net",
    # Google Cloud Storage fsspec backends; carve to sdk (Azure-focused distro). Core python3-fsspec stays in base.
    "python3-fsspec+gcs",
    "python3-fsspec+gs",
    # GCP nbdkit plugin (consumes python3-google-cloud-storage which is being demoted to sdk); carve along with the GCP Python SDK cluster.
    "nbdkit-gcs-plugin",
    # GCE Pacemaker fence agent; carve to sdk (Azure-focused distro), analogous to fence-agents-aws.
    "fence-agents-gce",
    # PEP-508 optional-deps sub-packages whose extras pull in deps not in base; main pkgs remain in base
    "python-systemd-doc",
    # PEP-508 +extras sub-package; optional dep not in base
    "python3-dns+doh",
    "python3-dns+doq",
    "python3-dns+trio",
    # PEP-508 +extras sub-package; optional dep not in base
    "python3-fsspec+dask",
    # PEP-508 +extras sub-package; optional dep not in base
    "python3-jsonschema+format",
    "python3-jsonschema+format-nongpl",
    # PEP-508 +extras sub-package; optional dep not in base
    "python3-lxml+cssselect",
    # PEP-508 +extras sub-package; optional dep not in base
    "python3-networkx+extra",
    # PEP-508 +extras sub-package; optional dep not in base
    "python3-oauthlib+signals",
    # PEP-508 +extras sub-package; optional dep not in base
    "python3-pooch+xxhash",
    # PEP-508 +extras sub-package; optional dep not in base
    "python3-pymongo+ocsp",
    # PEP-508 +extras sub-package; optional dep not in base
    "python3-qrcode+all",
    "python3-qrcode+pil",
    # PEP-508 +extras sub-package; optional dep not in base
    "python3-sqlalchemy+aiomysql",
    "python3-sqlalchemy+postgresql_pg8000",
]
